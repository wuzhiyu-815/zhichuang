name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Check all tracked Python source
        run: python -c "import ast, pathlib, subprocess; files=subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)); [ast.parse(pathlib.Path(p).read_text(encoding='utf-8-sig'), filename=p) for p in files if p.endswith('.py')]"
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: node --check static/workspace-main.js
      - run: node tests/test_render_selection.js
      - run: node tests/test_system_update_ui.js
      - run: node tests/test_skill_deletion_ui.js
