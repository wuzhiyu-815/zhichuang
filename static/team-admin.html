<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团队管理 · 短剧工厂</title><link rel="stylesheet" href="/static/team.css"></head><body><main>
<div class="nav"><h1>团队管理</h1><a href="/">返回工作区</a><a href="/account/password">修改我的密码</a></div><p>成员管理自己的项目、素材和模型 API；ComfyUI 节点由管理员分配。管理员管理全部。停用账号后会立即撤销该账号的登录权限，已有数据保留。</p>
<section class="panel"><h2>创建账号</h2><form id="create-form"><div class="form-grid"><label>登录账号<input id="username" required pattern="[A-Za-z0-9_][A-Za-z0-9_.-]{2,31}" autocomplete="off" placeholder="例如 editor01"></label><label>显示名称<input id="display-name" maxlength="60" placeholder="例如 小王"></label><label>初始密码<input id="password" type="password" minlength="6" maxlength="256" required autocomplete="new-password" placeholder="至少 6 个字符"></label><label>角色<select id="role"><option value="member">普通成员</option><option value="admin">管理员</option></select></label></div><button id="create-button" style="margin-top:18px">创建账号</button><span class="muted"> 新账号首次登录必须修改密码。</span></form></section>
<p id="status" class="status" role="status"></p><section class="panel"><h2>账号列表</h2><div class="scroll"><table><thead><tr><th>账号 / 邮箱</th><th>名称</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section id="nodes-panel" class="panel" hidden><h2 id="nodes-title">分配 ComfyUI 节点</h2><p>仅修改该成员的节点，不读取或修改其模型 API 密钥。保存后，尚未提交的渲染任务自动使用最新分配和在线节点；已提交的任务继续完成。</p><form id="nodes-form"><div id="nodes-rows"></div><p id="nodes-health" class="muted" aria-live="polite"></p><button id="nodes-add" type="button" class="secondary">＋ 添加节点</button> <button id="nodes-copy" type="button" class="secondary">从我的节点选择</button><div id="nodes-catalog" hidden></div><div style="margin-top:18px"><button id="nodes-save">保存分配</button> <button id="nodes-cancel" type="button" class="secondary">取消</button></div><p id="nodes-status" class="status" role="status"></p></form></section>
<section id="reset-panel" class="panel" hidden><h2 id="reset-title">重置密码</h2><form id="reset-form"><label>新初始密码<input id="reset-password" type="password" minlength="6" maxlength="256" autocomplete="new-password" required></label><button style="margin-top:15px">保存并撤销旧登录</button> <button class="secondary" type="button" id="reset-cancel">取消</button></form></section>
<section class="panel"><h2>邮箱注册与发信设置</h2><p>邮箱验证通过后直接成为普通成员。先保存配置并发送测试邮件，确认收到后开启注册。</p><form id="mail-form"><div class="form-grid"><label>注册状态<select id="mail-enabled"><option value="false">关闭邮箱注册</option><option value="true">开启邮箱注册</option></select></label><label>SMTP 主机<input id="mail-host" placeholder="例如 smtp.example.com" maxlength="255"></label><label>端口<input id="mail-port" type="number" min="1" max="65535" value="465" required></label><label>加密方式<select id="mail-security"><option value="ssl">SSL/TLS（通常为 465）</option><option value="starttls">STARTTLS（通常为 587）</option></select></label><label>SMTP 账号<input id="mail-username" autocomplete="off"></label><label>SMTP 密码 / 邮箱授权码<input id="mail-password" type="password" autocomplete="new-password" placeholder="留空保留已保存的授权码"></label><label>发件邮箱<input id="mail-sender" type="email"></label></div><button id="mail-save" style="margin-top:18px">保存发信设置</button></form><form id="mail-test-form" style="margin-top:20px"><label>接收测试邮件的邮箱<input id="mail-recipient" type="email" required></label><button id="mail-test" class="secondary">发送测试邮件（使用已保存配置）</button></form><p id="mail-status" class="status" role="status"></p></section>
<section class="panel"><h2>最近操作</h2><div class="scroll"><table><thead><tr><th>时间</th><th>账号</th><th>操作</th></tr></thead><tbody id="audit"></tbody></table></div></section>
</main><script src="/static/team-admin.js?v=dynamic-nodes-1"></script></body></html>
