<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮箱注册 · 短剧工厂</title><link rel="stylesheet" href="/static/team.css"></head><body><main class="auth"><h1>注册你的创作账号</h1><p>验证邮箱后即可使用。你将成为普通成员，项目和素材默认仅自己可见，管理员可管理。</p><p id="status" class="status" role="status"></p><form id="register-form"><label>邮箱<input id="email" type="email" autocomplete="email" maxlength="254" required></label><button id="send-code" type="button" class="secondary" disabled>发送验证码</button><label>邮箱验证码<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="六位数字，10 分钟内有效"></label><label>显示名称<input id="display-name" autocomplete="nickname" maxlength="60"></label><label>密码<input id="password" type="password" autocomplete="new-password" minlength="6" maxlength="256" required placeholder="至少 6 个字符"></label><label>确认密码<input id="confirm-password" type="password" autocomplete="new-password" required maxlength="256"></label><button id="submit" class="full" disabled>验证并注册</button></form><p><a href="/login">已有账号，去登录</a></p></main><script src="/static/team-register.js?v=20260919-entry"></script></body></html>
